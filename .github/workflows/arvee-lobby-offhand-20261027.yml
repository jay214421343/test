name: ARVEE Lobby offhand protection — Paper 26.3 / Java 25
on:
  push:
    branches: [arvee-lobby-offhand-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Reconstruct verified source
        run: |
          set -euo pipefail
          base64 -d arvee-lobby-offhand-source.zip.b64 > source.zip
          echo '02d43cd6b25d748c3838ef9ea3a5ba864ebafa89a2e53fd85f22c6a46ae4952f  source.zip' | sha256sum -c -
          unzip -q source.zip -d src
          grep -q 'PlayerSwapHandItemsEvent' src/cosmetics/src/main/java/world/arvee/cosmetics/ArveeCosmetics.java
          grep -q 'PlayerSwapHandItemsEvent' src/rewards/src/main/java/world/arvee/rewards/ArveeRewards.java
          grep -q 'PlayerSwapHandItemsEvent' src/settings/src/main/java/world/arvee/settings/ArveeSettings.java
      - name: Compile three plugins against real Paper API
        run: |
          set -euo pipefail
          for module in cosmetics rewards settings; do
            gradle -p src/"$module" clean jar --no-daemon --stacktrace
          done
      - name: Check offhand regression invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for module in ['cosmetics','rewards','settings']:
              classes=list(Path('src',module,'src/main/java').rglob('*.java'))
              assert classes
              s='\n'.join(p.read_text() for p in classes)
              for token in ('PlayerSwapHandItemsEvent','getOffHandItem()','getMainHandItem()','setCancelled(true)','ClickType.SWAP_OFFHAND','getItemInOffHand()'):
                  assert token in s,(module,token)
          print('Three shortcut handlers guarded against F-key + inventory offhand moves.')
          PY
      - name: Verify JAR integrity, versions and Java 25 classes
        run: |
          set -euo pipefail
          for spec in 'cosmetics:ArveeCosmetics:1.1.2:world/arvee/cosmetics/ArveeCosmetics.class' 'rewards:ArveeRewards:1.0.4:world/arvee/rewards/ArveeRewards.class' 'settings:ArveeSettings:1.0.4:world/arvee/settings/ArveeSettings.class'; do
            IFS=: read -r module jarname version class <<< "$spec"
            jarfile="src/$module/build/libs/$jarname-$version-Paper26.3.jar"
            test -s "$jarfile"
            unzip -t "$jarfile" | tail -1
            unzip -p "$jarfile" plugin.yml | grep -F "version: $version"
            jar tf "$jarfile" | grep -Fx "$class"
            javap -verbose -classpath "$jarfile" "${class%.class}" | grep -F 'major version: 69'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ARVEE-Lobby-OffhandFix-Paper26.3-JARs
          path: src/*/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error
