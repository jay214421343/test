name: ARVEEPrison v1.2.4 - Economy and Stability
on:
  push:
    branches: [arvee-prison-v124-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Recover verified base v1.2.3
        shell: bash
        run: |
          set -euo pipefail
          base64 -d arvee-prison-v120-full-source.tar.xz.b64 > source.tar.xz
          echo 'c6cf0a3cc1a901fa09bb61f4f09ebf35e87a6df26d71f27e7cc4dbbe730ad22f  source.tar.xz' | sha256sum -c -
          tar -xJf source.tar.xz --overwrite
          base64 -d arvee-v121.patch.xz.b64 > v121.patch.xz
          echo '26e36a3cce4909c85f14032d04d36120705af4d4e325f3e539f3ed89e02da493  v121.patch.xz' | sha256sum -c -
          tar -xJf v121.patch.xz --overwrite
          python3 patch-v122.py
          base64 -d arvee-v123-prestige-ascension.patch.xz.b64 > v123.patch.xz
          echo '1729ca55d286c1cdba052fd97ad85258998bcf21809174aade3b5e8e7d8bf5f1  v123.patch.xz' | sha256sum -c -
          xz -dc v123.patch.xz | patch --batch --fuzz=0 -p1
          grep -Fx 'version: 1.2.3' src/main/resources/plugin.yml
      - name: Apply v1.2.4 token-price and QoL patch
        run: |
          set -euo pipefail
          python3 patch-v124.py
          grep -Fx 'version: 1.2.4' src/main/resources/plugin.yml
          grep -F 'version = "1.2.4"' build.gradle.kts
      - name: Regression checks (prestige and old worlds)
        run: |
          set -euo pipefail
          python3 tests/prestige_ascension_regression.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/main/java/world/arvee/prison')
          engine=(root/'PrisonEnchantEngine.java').read_text()
          menu=(root/'PrisonUnifiedMenu.java').read_text()
          main=(root/'ArveePrison.java').read_text()
          config=Path('src/main/resources/config.yml').read_text()
          assert 'return plugin.enchants().levelPrice(e.id, nextLevel)' in menu
          assert 'return levelPrice(p.id,level(user.getUniqueId(),p)+1)' in engine
          assert 'pricing:\n    exponent: 1.25' in config
          assert 'Math.pow(next,1.65)' not in engine
          assert 'Math.pow(nextLevel, 1.65)' not in menu
          assert 'upgradeBulk(player,type,1)' in main
          assert 'prestigeAscension.save();enchants.save()' in main
          assert 'private static final int RESET_MINUTES=20' in (root/'PrisonPrestigeMines.java').read_text()
          print('v1.2.4 source safety and migration regression checks passed')
          PY
      - name: Java-only pricing tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/pricingclasses
          cat >/tmp/PrisonEnchantPricingTest.java <<'JAVA'
          package world.arvee.prison;
          public final class PrisonEnchantPricingTest {
            static void check(boolean b,String message){if(!b)throw new AssertionError(message);}
            public static void main(String[] args) {
              long old=(long)Math.ceil(100*Math.pow(26,1.65));
              long current=PrisonEnchantPricing.levelCost(100,26,1.25,1.0);
              check(old>20000 && current>=5000 && current<7000,"level 25 to 26 discount");
              long previous=0;
              for(int i=1;i<=2500;i++) {
                long next=PrisonEnchantPricing.levelCost(100,i,1.25,1.0);
                check(next>=previous,"monotonic pricing");previous=next;
              }
              check(PrisonEnchantPricing.levelCost(Long.MAX_VALUE,10000,2.5,3.0)==PrisonEnchantPricing.MAX_PRICE,"overflow");
              check(PrisonEnchantPricing.levelCost(-1,1,Double.NaN,Double.NaN)>=1,"malformed price");
              check(PrisonEnchantPricing.levelCost(100,26,1.65,1.0)==old,"legacy configurable");
              System.out.println("Price regression: old="+old+" now="+current);
            }
          }
          JAVA
          javac -d /tmp/pricingclasses src/main/java/world/arvee/prison/PrisonEnchantPricing.java /tmp/PrisonEnchantPricingTest.java
          java -cp /tmp/pricingclasses world.arvee.prison.PrisonEnchantPricingTest
      - name: Compile genuine Paper 26.3 and Java 25
        run: gradle clean jar --no-daemon --stacktrace
      - name: Verify compiled JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/ArveePrison-1.2.4-Paper26.3.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fx 'version: 1.2.4'
          for cls in ArveePrison PrisonEnchantEngine PrisonEnchantPricing PrisonPrestigeAscension PrisonMineExplosives PrisonPrestigeMines; do
            jar tf "$JAR" | grep -Fx "world/arvee/prison/$cls.class"
          done
          unzip -t "$JAR" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ARVEEPrison-1.2.4-Paper26.3
          path: build/libs/ArveePrison-1.2.4-Paper26.3.jar
          if-no-files-found: error
          retention-days: 30
