name: Build ARVEEPrison v1.2.3 - Prestige Ascension
on:
  push:
    branches: [arvee-prison-v123-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Restore verified v1.2.0 codebase
        shell: bash
        run: |
          set -euo pipefail
          base64 -d arvee-prison-v120-full-source.tar.xz.b64 > source.tar.xz
          echo 'c6cf0a3cc1a901fa09bb61f4f09ebf35e87a6df26d71f27e7cc4dbbe730ad22f  source.tar.xz' | sha256sum -c -
          tar -xJf source.tar.xz --overwrite
      - name: Apply v1.2.1 source changes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d arvee-v121.patch.xz.b64 > v121.patch.xz
          echo '26e36a3cce4909c85f14032d04d36120705af4d4e325f3e539f3ed89e02da493  v121.patch.xz' | sha256sum -c -
          tar -xJf v121.patch.xz --overwrite
      - name: Restore v1.2.2 explosive bugfix
        shell: bash
        run: |
          set -euo pipefail
          python3 patch-v122.py
          grep -Fx 'version: 1.2.2' src/main/resources/plugin.yml
      - name: Apply v1.2.3 Prestige Ascension feature patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d arvee-v123-prestige-ascension.patch.xz.b64 > v123.patch.xz
          echo '1729ca55d286c1cdba052fd97ad85258998bcf21809174aade3b5e8e7d8bf5f1  v123.patch.xz' | sha256sum -c -
          xz -dc v123.patch.xz | patch --batch --fuzz=0 -p1
          grep -Fx 'version: 1.2.3' src/main/resources/plugin.yml
          grep -F 'version = "1.2.3"' build.gradle.kts
      - name: Regression checks for cap, unlocks, saves and no resets
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/prestige_ascension_regression.py
      - name: Compile real Paper 26.3 plugin using Java 25
        run: gradle clean jar --no-daemon --stacktrace
      - name: Verify JAR and classes
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/ArveePrison-1.2.3-Paper26.3.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fx 'version: 1.2.3'
          for cls in ArveePrison PrisonPrestigeAscension PrisonPrestige PrisonMineExplosives PrisonPrestigeMines PrisonAscension PrisonTutorial; do
            jar tf "$JAR" | grep -Fx "world/arvee/prison/$cls.class"
          done
          unzip -t "$JAR" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ARVEEPrison-1.2.3-Paper26.3
          path: build/libs/ArveePrison-1.2.3-Paper26.3.jar
          retention-days: 30
          if-no-files-found: error
