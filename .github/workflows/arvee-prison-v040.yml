name: Build ARVEE Prison v0.4.0 Paper 26.3
on:
  push:
    branches: [arvee-prison-v040-20261025]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract verified v0.3 source
        run: tar -xJf prison-v03-source.tar.xz
      - name: Apply v0.4 source upgrade
        run: |
          gzip -dc prison-v04.diff.gz | patch --batch -p4
          sed -i 's/version = "0.3.0"/version = "0.4.0"/' build.gradle.kts
          grep 'version: 0.4.0' src/main/resources/plugin.yml
      - name: Compile with real Paper API
        run: gradle clean build --no-daemon --stacktrace
      - name: Inspect resulting JAR
        run: |
          jar tf build/libs/ArveePrison-0.4.0-Paper26.3.jar | grep 'world/arvee/prison/PhysicalCrates.class'
          jar tf build/libs/ArveePrison-0.4.0-Paper26.3.jar | grep 'world/arvee/prison/Worlds.class'
          jar tf build/libs/ArveePrison-0.4.0-Paper26.3.jar | grep 'plugin.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: ArveePrison-v0.4.0-Paper26.3
          path: build/libs/ArveePrison-0.4.0-Paper26.3.jar
          if-no-files-found: error
