name: Build Arvee Prison Paper 26.3
on:
  push:
    branches: [arvee-prison-build-20261025]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract source
        run: tar -xjf prison-source.tar.bz2
      - name: Compile with the real Paper API
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArveePrison-Paper26.3
          path: build/libs/*.jar
          if-no-files-found: error
