name: Build Arvee Prison 0.3 Paper 26.3
on:
  push:
    branches: [arvee-prison-v030-20261025]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract ARVEE Prison source
        run: tar -xJf prison-v03-source.tar.xz
      - name: Compile against real Paper API and PlaceholderAPI
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArveePrison-0.3.0-Paper26.3
          path: build/libs/*.jar
          if-no-files-found: error
