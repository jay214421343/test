name: ARVEEPrison v1.0.5.2 — Paper 26.3 / Java 25
on:
  push:
    branches: [arvee-prison-v1052-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack verified complete source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d arvee-prison-v1052-fullsource.zip.b64 > arvee1052.zip
          echo "578c2be8fd44e8f1c959d6eed98e4a478bc6e02bb545b48158686f93a68037b9  arvee1052.zip" | sha256sum -c -
          unzip -q -o arvee1052.zip
          test -f build.gradle.kts
          grep -Fx 'version: 1.0.5.2' src/main/resources/plugin.yml
      - name: Compile against real Paper API
        run: gradle clean jar --no-daemon --stacktrace
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/ArveePrison-1.0.5.2-Paper26.3.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx 'plugin.yml'
          jar tf "$JAR" | grep -Fx 'world/arvee/prison/ArveePrison.class'
          unzip -p "$JAR" plugin.yml | grep -Fx 'version: 1.0.5.2'
          unzip -t "$JAR" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ARVEEPrison-1.0.5.2-Paper26.3
          path: build/libs/ArveePrison-1.0.5.2-Paper26.3.jar
          retention-days: 30
          if-no-files-found: error
