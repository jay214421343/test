name: ARVEE Prison v0.5.0 Paper 26.3
on:
  push:
    branches: [arvee-prison-v050-20261025]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract full source
        run: tar -xjf prison-v050-source.tar.bz2
      - name: Compile against Paper 26.3 API
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArveePrison-v0.5.0-Paper26.3
          path: build/libs/*.jar
          if-no-files-found: error
