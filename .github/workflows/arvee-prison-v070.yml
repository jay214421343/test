name: ARVEE Prison v0.7.1 Paper 26.3
on:
  push:
    branches: [arvee-prison-v070-20261025]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract v0.7 source snapshot
        run: |
          base64 -d prison-v070-full-source.tar.xz.b64 | xz -d > prison-v070-full-source.tar
          rm -rf src build.gradle.kts settings.gradle.kts
          tar -xf prison-v070-full-source.tar
      - name: Apply auto-equip, version and robot production fixes
        run: |
          base64 -d prison-v071-auto-equip.patch.xz.b64 | xz -d > prison-v071-auto-equip.patch
          patch -p1 --batch < prison-v071-auto-equip.patch
          grep -q 'version = "0.7.1"' build.gradle.kts
          grep -q 'auto-equip-on-join: true' src/main/resources/config.yml
      - name: Compile with the official Paper 26.3 API
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArveePrison-v0.7.1-Paper26.3
          path: build/libs/ArveePrison-0.7.1-Paper26.3.jar
          if-no-files-found: error
